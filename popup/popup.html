<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notion Clipper</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header>
      <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23ffffff' stroke-width='2'%3E%3Crect x='3' y='3' width='18' height='18' rx='2'/%3E%3Cpath d='M9 3v18'/%3E%3Cpath d='M15 3v18'/%3E%3Cpath d='M3 9h18'/%3E%3C/svg%3E" alt="Notion" class="logo">
      <h1>Notion Clipper</h1>
    </header>

    <!-- Auth Section -->
    <div id="auth-section" class="section">
      <p>Connect your Notion to start clipping</p>
      <button id="auth-btn" class="btn btn-primary">Connect Notion</button>
    </div>

    <!-- Main Clip Section -->
    <div id="clip-section" class="section hidden">
      <div class="page-info">
        <img id="favicon" src="" alt="" class="favicon hidden">
        <div class="page-details">
          <input type="text" id="page-title" class="page-title-input" placeholder="Page title">
          <span id="page-url" class="page-url"></span>
        </div>
      </div>

      <div class="notes-section">
        <label for="notes">Notes</label>
        <textarea id="notes" rows="4" placeholder="Add your notes here..."></textarea>
      </div>

      <div class="destination-section">
        <label for="destination">Save to</label>
        <select id="destination">
          <option value="">Select destination...</option>
        </select>
        <button id="refresh-destinations" class="btn btn-small" title="Refresh destinations">↻</button>
      </div>

      <button id="save-btn" class="btn btn-primary btn-full">
        <span class="btn-text">Save to Notion</span>
        <span class="btn-loading hidden">Saving...</span>
      </button>
    </div>

    <!-- Status Messages -->
    <div id="status" class="status hidden"></div>

    <!-- Options Link -->
    <footer>
      <a href="#" id="options-link">Settings</a>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
